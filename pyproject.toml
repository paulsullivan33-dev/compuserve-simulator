[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-compuserve"
version = "1.17.0"
description = "An independent historical simulation of CompuServe circa 1988"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
classic-compuserve = "compuserve:main"

[tool.setuptools]
packages = []
py-modules = [
    "compuserve",
    "web_app",
    "telnet_app",
    "event_worker",
    "feed_utils",
    "make_sysop",
    "cis_accounts",
    "cis_adventure_league",
    "cis_announcements",
    "cis_arcade",
    "cis_archive",
    "cis_aviation",
    "cis_billing",
    "cis_books",
    "cis_business",
    "cis_cb",
    "cis_christmas",
    "cis_communications",
    "cis_communities",
    "cis_cooking",
    "cis_crossword",
    "cis_discovery",
    "cis_disruptions",
    "cis_drafts",
    "cis_dynamic",
    "cis_eliza",
    "cis_entertainment",
    "cis_experience",
    "cis_features",
    "cis_fitness",
    "cis_forums",
    "cis_giftguide",
    "cis_guitar",
    "cis_hamnet",
    "cis_hardware",
    "cis_library",
    "cis_magazine",
    "cis_mail",
    "cis_migrations",
    "cis_news",
    "cis_nightstation",
    "cis_ownership",
    "cis_period_news",
    "cis_pets",
    "cis_phones",
    "cis_photo",
    "cis_poster",
    "cis_reference",
    "cis_roots",
    "cis_scifi",
    "cis_security",
    "cis_session",
    "cis_settings",
    "cis_shareware",
    "cis_space",
    "cis_sports",
    "cis_storage",
    "cis_store",
    "cis_story",
    "cis_sysop",
    "cis_tech",
    "cis_terminal",
    "cis_timecapsule",
    "cis_timeline",
    "cis_tradingpost",
    "cis_trains",
    "cis_travel",
    "cis_version",
    "cis_veterans",
    "cis_weather",
    "cis_web_files",
    "cis_yearend"
]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["old_versions"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
