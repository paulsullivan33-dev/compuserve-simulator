[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-compuserve"
version = "1.16.0"
description = "An independent historical simulation of CompuServe circa 1988"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
classic-compuserve = "compuserve:main"

[tool.setuptools]
py-modules = [
    "compuserve", "cis_accounts", "cis_announcements", "cis_billing",
    "cis_business", "cis_cb", "cis_discovery", "cis_drafts", "cis_dynamic",
    "cis_experience", "cis_features", "cis_forums", "cis_library", "cis_mail",
    "cis_migrations", "cis_news", "cis_period_news", "cis_reference",
    "cis_security", "cis_session", "cis_settings", "cis_storage", "cis_store",
    "cis_sysop", "cis_terminal", "cis_timeline", "cis_travel", "cis_version",
    "cis_weather", "cis_story", "cis_disruptions", "cis_ownership", "cis_shareware", "cis_phones", "cis_communities", "cis_web_files", "cis_magazine",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["old_versions"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
