name: Pylint

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Must match the project's supported versions (requires-python >=3.10
        # in pyproject.toml, same as the test workflow). Linting on older
        # interpreters produces bogus syntax-error failures.
        python-version: ["3.10", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # setuptools is imported at module level by build_support.py, but it
        # is only a build-system requirement (provided during isolated wheel
        # builds), so install it explicitly for pylint's import resolution.
        python -m pip install --upgrade pip setuptools
        # Install the project with its dependencies so pylint can resolve
        # third-party imports (fastapi, etc.) instead of reporting
        # import-errors for them.
        python -m pip install -e ".[dev,web]"
        python -m pip install pylint
    - name: Analysing the code with pylint
      run: |
        # Errors only: this codebase has its own style (ruff config in
        # pyproject.toml) and default pylint flags thousands of convention
        # nitpicks. The error level catches real bugs -- undefined names,
        # bad call signatures, syntax errors -- without the noise.
        pylint --disable=all --enable=E $(git ls-files '*.py')
